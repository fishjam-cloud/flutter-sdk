name: fishjam_example
description: "Minimal Fishjam room built with fishjam_client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  fishjam_client:
    path: ../
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.2
  http: ^1.6.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  # This app lives inside the fishjam_client plugin. With Swift Package Manager, the Flutter tool copies
  # the whole plugin directory into build/ios/SourcePackages because the plugin's Package.swift depends
  # on flutter_webrtc; that destination is inside the plugin, so the copy recurses. CocoaPods is used
  # instead until the Flutter tool excludes example/ from that copy (flutter/flutter#188647).
  config:
    enable-swift-package-manager: false
  uses-material-design: true
