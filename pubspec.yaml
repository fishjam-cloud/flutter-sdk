name: fishjam_client
description: >-
  Fishjam client SDK for Flutter. Join Fishjam rooms and exchange real-time
  audio, video and data from iOS and Android apps.
version: 0.31.0
homepage: https://fishjam.io
repository: https://github.com/fishjam-cloud/flutter-client-sdk
issue_tracker: https://github.com/fishjam-cloud/flutter-client-sdk/issues

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  collection: ^1.19.0
  connectivity_plus: ^7.3.2
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.2
  http: ^1.6.0
  meta: ^1.15.0
  protobuf: ^6.1.0
  uuid: ^4.6.0

dev_dependencies:
  connectivity_plus_platform_interface: ^2.1.0
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  protoc_plugin: ^25.1.0
  very_good_analysis: ^11.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.fishjam.client
        pluginClass: FishjamClientPlugin
      ios:
        pluginClass: FishjamClientPlugin
