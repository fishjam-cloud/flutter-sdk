include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - lib/src/proto/**
  errors:
    # Implementation agents fill these in; keep TODOs visible but non-fatal.
    todo: ignore

linter:
  rules:
    # The SDK is a library: public members are documented, but we do not
    # require docs on every private helper.
    public_member_api_docs: true
    avoid_print: true
