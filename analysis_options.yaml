include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - lib/src/proto/**
    - build/**
  errors:
    # Keep TODOs visible but non-fatal.
    todo: ignore

linter:
  rules:
    # Off: it forces boilerplate docs on internal lib/src members; the
    # exported API is documented by review instead.
    public_member_api_docs: false
    avoid_print: true
    # Prefer the familiar `ClassName(...)` constructor declarations over the
    # newer `new(...)` form for readability by contributors on older SDKs.
    unnecessary_type_name_in_constructor: false
